<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">

  <link rel="stylesheet" href="assets/css/styles.css">
  <link rel="stylesheet" href="assets/css/menu.css">
  <link rel="stylesheet" href="assets/css/support.css">
</head>
<body>
  <main class="app-shell support-page">
    <header class="support-header">
      <a class="support-back" href="index.html" aria-label="Volver al inicio">←</a>
      <h1>Soporte</h1>
      <button id="menuToggle" class="support-menu-button" type="button" aria-label="Abrir menú" aria-expanded="false" aria-controls="siteMenu">
        <span></span><span></span><span></span>
      </button>
    </header>

    <div id="menuOverlay" class="menu-overlay"></div>

    <aside id="siteMenu" class="menu-drawer" aria-hidden="true">
      <div class="menu-brand">Pizza Vicente</div>
      <nav class="menu-nav" aria-label="Menú principal">
        <a class="menu-link" href="index.html"><span>Inicio</span><span class="menu-arrow">›</span></a>
        <a class="menu-link" href="index.html#tabs"><span>Comidas</span><span class="menu-arrow">›</span></a>
        <a class="menu-link" href="seguimiento.html"><span>Seguir pedido</span><span class="menu-arrow">›</span></a>
        <a class="menu-link" href="soporte.html" aria-current="page"><span>Soporte</span><span class="menu-arrow">›</span></a>
      </nav>
      <p class="menu-footnote">Navegación V1. Las conexiones reales de soporte y CRM se incorporarán en las siguientes etapas.</p>
    </aside>

    <section class="support-illustration" aria-label="Asistencia de Pizza Vicente">
      <svg viewBox="0 0 360 230" role="img" aria-label="Chef de soporte atendiendo consultas">
        <rect width="360" height="230" fill="#f8f6f2"/>
        <ellipse cx="180" cy="118" rx="110" ry="78" fill="#f2ece4"/>

        <g opacity=".95">
          <path d="M40 82h62c13 0 24 11 24 24v10H62c-18 0-32-14-32-32 0-1 4-2 10-2z" fill="#eee9e2"/>
          <path d="M245 68h62c17 0 31 14 31 31v11h-72c-20 0-36-16-36-36 0-3 5-6 15-6z" fill="#b68951"/>
          <path d="M260 86h50M260 99h39" stroke="#f8f6f2" stroke-width="5" stroke-linecap="round"/>
        </g>

        <g transform="translate(105 28)">
          <path d="M66 10c8 0 15 4 19 11 10 0 18 8 18 18 0 7-4 13-10 16H37c-7-4-10-9-10-16 0-10 8-18 18-18 4-7 11-11 21-11z" fill="#ffffff"/>
          <rect x="43" y="47" width="45" height="22" rx="2" fill="#ffffff"/>

          <circle cx="66" cy="86" r="30" fill="#efd1b8"/>
          <path d="M42 82c3-18 17-30 37-30 12 0 22 4 30 14-2 9-8 15-16 18-7-5-15-7-24-7-9 0-18 2-27 5z" fill="#2e2d32"/>
          <circle cx="58" cy="87" r="2.6" fill="#2e2d32"/>
          <circle cx="75" cy="87" r="2.6" fill="#2e2d32"/>
          <path d="M58 99c5 4 11 4 16 0" stroke="#9a654c" stroke-width="3" stroke-linecap="round"/>

          <path d="M37 120c8-11 18-17 29-17 13 0 24 6 32 18l10 59H26z" fill="#a55f12"/>
          <path d="M48 119h36v61H48z" fill="#ffffff"/>
          <path d="M66 120v60M48 138h36M48 155h36" stroke="#ded7ce" stroke-width="3"/>
          <rect x="82" y="138" width="15" height="9" rx="4" fill="#e8dfd2"/>
          <rect x="85" y="140" width="9" height="5" rx="2" fill="#a55f12"/>

          <path d="M35 132 16 162h31l14-23" fill="none" stroke="#efd1b8" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M98 132l18 30" fill="none" stroke="#efd1b8" stroke-width="9" stroke-linecap="round"/>
        </g>

        <g transform="translate(56 165)">
          <path d="M18 0h129l8 37H8z" fill="#ffffff"/>
          <circle cx="82" cy="18" r="4.5" fill="#a55f12"/>
          <path d="M155 0h56v37h-51z" fill="#ddd7cf"/>
        </g>
      </svg>
    </section>

    <section class="support-section" aria-labelledby="supportTopicsTitle">
      <p class="support-eyebrow">SOPORTE TÉCNICO</p>
      <h2 id="supportTopicsTitle">¿Cómo podemos ayudarte?</h2>

      <div class="support-topic-list" role="group" aria-label="Motivo de contacto">
        <button class="support-topic active" type="button" data-topic="last-purchase" aria-pressed="true">
          <span>Problemas con mi última compra</span>
          <span class="support-arrow">›</span>
        </button>
        <button class="support-topic" type="button" data-topic="where-order" aria-pressed="false">
          <span>¿Dónde está mi pedido?</span>
          <span class="support-arrow">›</span>
        </button>
      </div>
    </section>

    <section class="support-section support-form-section" aria-labelledby="contactDataTitle">
      <p class="support-eyebrow">DATOS DE CONTACTO</p>
      <h2 id="contactDataTitle">Completá tus datos</h2>

      <div class="support-form">
        <label class="support-field" for="supportEmail">
          <span>Correo electrónico</span>
          <input id="supportEmail" type="email" placeholder="ejemplo@correo.com" autocomplete="email">
        </label>

        <label class="support-field" for="supportName">
          <span>Nombre</span>
          <input id="supportName" type="text" placeholder="Tu nombre" autocomplete="name">
        </label>
      </div>
    </section>

    <div class="support-bottom-spacer" aria-hidden="true"></div>
  </main>

  <div class="support-cta-bar">
    <button id="contactButton" class="support-primary-action" type="button" disabled>Contactar</button>
  </div>

  <div id="toast" class="toast" role="status"></div>

  <script type="module" src="assets/js/menu.js"></script>
  <script type="module" src="assets/js/support.js"></script>
</body>
</html>
